<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Igreja Conectada - Cadastro do Membro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 flex justify-center items-center min-h-screen p-0 sm:p-4 text-gray-800">

  <!-- CONTAINER DO CELULAR (MOCKUP RESPONSIVO) -->
  <div class="w-full sm:w-[420px] h-full sm:h-[860px] bg-white sm:rounded-[36px] shadow-2xl overflow-hidden flex flex-col relative border-0 sm:border-4 sm:border-gray-800">
    
    <!-- TOPO DECORATIVO DO CELULAR -->
    <div class="hidden sm:flex items-center justify-between px-6 pt-3 text-[10px] text-gray-400 font-medium bg-white">
      <span>9:41</span>
      <div class="w-20 h-4 bg-gray-900 rounded-full mx-auto"></div>
      <span>5G • 100%</span>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 overflow-y-auto px-6 py-6 flex flex-col justify-between bg-gradient-to-b from-indigo-50/60 via-white to-white">
      
      <!-- CABEÇALHO -->
      <div class="text-center mb-4">
        <div class="w-14 h-14 bg-indigo-900 text-white font-bold rounded-2xl flex items-center justify-center text-2xl shadow-md mx-auto mb-2.5">
          ✝️
        </div>
        <h1 class="text-xl font-bold text-gray-900" id="form-title">Seja bem-vindo!</h1>
        <p class="text-xs text-gray-500 mt-0.5" id="form-subtitle">Crie sua conta para acompanhar as novidades da sua igreja local.</p>
      </div>

      <!-- MENSAGEM DE ERRO/ALERTA -->
      <div id="alert-box" class="hidden p-3 mb-3 text-xs rounded-xl border bg-red-50 border-red-200 text-red-700"></div>

      <!-- FORMULÁRIO DE CADASTRO / LOGIN -->
      <form id="form-membro" class="space-y-3.5 flex-1">
        
        <!-- MODO LOGIN VS CADASTRO -->
        <div id="campo-nome">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Seu Nome Completo</label>
          <div class="relative">
            <span class="absolute left-3.5 top-2.5 text-gray-400 text-sm">👤</span>
            <input type="text" id="membro-nome" placeholder="Ex: João Silva" 
                   class="w-full pl-10 pr-4 py-2.5 text-xs sm:text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50/50">
          </div>
        </div>

        <!-- E-MAIL -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">E-mail</label>
          <div class="relative">
            <span class="absolute left-3.5 top-2.5 text-gray-400 text-sm">✉️</span>
            <input type="email" id="membro-email" required placeholder="seuemail@exemplo.com" 
                   class="w-full pl-10 pr-4 py-2.5 text-xs sm:text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50/50">
          </div>
        </div>

        <!-- FILTRO DE SELEÇÃO DA IGREJA LOCAL (MULTI-TENANT) -->
        <div id="campo-igreja-wrapper" class="bg-indigo-50/70 p-3.5 rounded-xl border border-indigo-100 space-y-2.5">
          <div class="flex items-center space-x-1.5 text-indigo-900 font-bold text-xs uppercase tracking-wider">
            <span>🔍</span>
            <span>Encontre sua Igreja Local</span>
          </div>

          <!-- Estado -->
          <div>
            <label class="block text-[11px] font-semibold text-gray-500 mb-1">Estado</label>
            <select id="membro-estado" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg bg-white outline-none focus:ring-1 focus:ring-indigo-500">
              <option value="TO">Tocantins (TO)</option>
              <option value="SP">São Paulo (SP)</option>
              <option value="GO">Goiás (GO)</option>
              <option value="RJ">Rio de Janeiro (RJ)</option>
              <option value="MG">Minas Gerais (MG)</option>
              <option value="BA">Bahia (BA)</option>
            </select>
          </div>

          <!-- Congregação Específica (Puxa do Firestore) -->
          <div>
            <label class="block text-[11px] font-semibold text-gray-500 mb-1">Sua Congregação / Templo</label>
            <select id="select-igreja" required class="w-full px-3 py-2 text-xs border border-indigo-300 rounded-lg bg-white font-medium text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="">Carregando congregações...</option>
            </select>
          </div>
          <p class="text-[10px] text-gray-400 leading-tight">Ao selecionar, seu app carregará apenas os avisos desta comunidade específica.</p>
        </div>

        <!-- SENHA -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Senha de Acesso</label>
          <div class="relative">
            <span class="absolute left-3.5 top-2.5 text-gray-400 text-sm">🔒</span>
            <input type="password" id="membro-senha" required placeholder="Mínimo 6 caracteres" minlength="6"
                   class="w-full pl-10 pr-4 py-2.5 text-xs sm:text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50/50">
          </div>
        </div>

        <!-- TERMOS -->
        <div id="campo-termos" class="flex items-start space-x-2 pt-0.5">
          <input type="checkbox" id="termos" checked class="accent-indigo-600 rounded mt-0.5 cursor-pointer">
          <label for="termos" class="text-[11px] text-gray-500 leading-tight cursor-pointer">
            Aceito os termos de uso e concordo em receber avisos da minha igreja.
          </label>
        </div>

        <!-- BOTÃO DE AÇÃO -->
        <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md flex items-center justify-center space-x-2 mt-2 cursor-pointer">
          <span id="btn-text">Criar Conta &amp; Entrar</span>
          <span>➔</span>
        </button>
      </form>

      <!-- ALTERNAR ENTRE LOGIN E CADASTRO -->
      <div class="text-center pt-3 border-t border-gray-100 mt-3">
        <p class="text-xs text-gray-500" id="toggle-container">
          <span id="toggle-text">Já tem uma conta criada?</span>
          <button type="button" id="btn-toggle-mode" class="text-indigo-600 font-bold hover:underline ml-1 cursor-pointer">
            Fazer Login
          </button>
        </p>
        <div class="mt-2">
          <a href="cadastro_lideranca.html" class="text-[11px] text-gray-400 hover:text-indigo-600 transition">
            É pastor ou líder da igreja? <span class="underline">Acesse aqui</span>
          </a>
        </div>
      </div>

    </main>
  </div>

  <!-- SCRIPT FIREBASE LOGIC -->
  <script type="module">
    import { 
      auth, 
      db, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      getDocs 
    } from './js/firebase-config.js';

    let isLoginMode = false;
    const form = document.getElementById('form-membro');
    const selectIgreja = document.getElementById('select-igreja');
    const alertBox = document.getElementById('alert-box');
    const btnToggle = document.getElementById('btn-toggle-mode');
    const campoNome = document.getElementById('campo-nome');
    const campoIgreja = document.getElementById('campo-igreja-wrapper');
    const campoTermos = document.getElementById('campo-termos');
    const btnText = document.getElementById('btn-text');
    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const toggleText = document.getElementById('toggle-text');

    // 1. Carregar igrejas cadastradas para o Select
    async function carregarIgrejas() {
      try {
        const snap = await getDocs(collection(db, 'igrejas'));
        selectIgreja.innerHTML = '<option value="">Selecione sua congregação...</option>';
        
        if (snap.empty) {
          // Opções padrão iniciais caso ainda não haja igrejas criadas
          selectIgreja.innerHTML += `
            <option value="1042">Igreja Batista Central - Sede Centro (TO)</option>
            <option value="1043">Igreja Batista Central - Congregação Sul (TO)</option>
            <option value="2011">Assembleia de Deus - Madureira (SP)</option>
          `;
          return;
        }

        snap.forEach((doc) => {
          const data = doc.data();
          selectIgreja.innerHTML += `
            <option value="${data.igreja_id || doc.id}">
              ${data.nome} (${data.cidade || ''} - ${data.estado || ''})
            </option>
          `;
        });
      } catch (err) {
        console.error('Erro ao carregar igrejas:', err);
        selectIgreja.innerHTML = `
          <option value="1042">Igreja Batista Central - Sede Centro (TO)</option>
          <option value="1043">Igreja Batista Central - Congregação Sul (TO)</option>
        `;
      }
    }

    carregarIgrejas();

    // 2. Alternar entre Modo Login e Modo Cadastro
    btnToggle.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      alertBox.classList.add('hidden');

      if (isLoginMode) {
        formTitle.textContent = 'Acessar Conta';
        formSubtitle.textContent = 'Entre com seu e-mail e senha cadastrados.';
        campoNome.classList.add('hidden');
        campoIgreja.classList.add('hidden');
        campoTermos.classList.add('hidden');
        btnText.textContent = 'Entrar no Aplicativo';
        toggleText.textContent = 'Ainda não tem conta?';
        btnToggle.textContent = 'Cadastre-se aqui';
      } else {
        formTitle.textContent = 'Seja bem-vindo!';
        formSubtitle.textContent = 'Crie sua conta para acompanhar as novidades da sua igreja local.';
        campoNome.classList.remove('hidden');
        campoIgreja.classList.remove('hidden');
        campoTermos.classList.remove('hidden');
        btnText.textContent = 'Criar Conta & Entrar';
        toggleText.textContent = 'Já tem uma conta criada?';
        btnToggle.textContent = 'Fazer Login';
      }
    });

    // 3. Submeter formulário (Auth + Firestore)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const email = document.getElementById('membro-email').value.trim();
      const senha = document.getElementById('membro-senha').value;
      const submitBtn = document.getElementById('btn-submit');

      submitBtn.disabled = true;
      btnText.textContent = 'Processando...';

      try {
        if (isLoginMode) {
          // LOGIN VIA FIREBASE AUTH
          await signInWithEmailAndPassword(auth, email, senha);
          window.location.href = 'index.html';
        } else {
          // CADASTRO VIA FIREBASE AUTH
          const nome = document.getElementById('membro-nome').value.trim() || 'Irmão(ã)';
          const igrejaId = selectIgreja.value;
          const igrejaNome = selectIgreja.options[selectIgreja.selectedIndex].text;
          const estado = document.getElementById('membro-estado').value;

          if (!igrejaId) {
            throw new Error('Por favor, selecione sua congregação.');
          }

          const cred = await createUserWithEmailAndPassword(auth, email, senha);
          
          // Salvar perfil com o vínculo 'igreja_id' no Firestore
          await setDoc(doc(db, 'usuarios', cred.user.uid), {
            uid: cred.user.uid,
            nome: nome,
            email: email,
            role: 'membro',
            tipo: 'membro',
            igreja_id: String(igrejaId), // Identificador Multi-tenant
            igreja_nome: igrejaNome,
            estado: estado,
            createdAt: new Date().toISOString()
          });

          window.location.href = 'index.html';
        }
      } catch (error) {
        console.error('Erro na autenticação:', error);
        let msg = error.message;
        if (error.code === 'auth/email-already-in-use') msg = 'Este e-mail já está cadastrado. Clique em Fazer Login.';
        if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') msg = 'E-mail ou senha incorretos.';
        if (error.code === 'auth/weak-password') msg = 'A senha deve ter pelo menos 6 caracteres.';
        
        alertBox.textContent = msg;
        alertBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = isLoginMode ? 'Entrar no Aplicativo' : 'Criar Conta & Entrar';
      }
    });
  </script>
</body>
</html>
